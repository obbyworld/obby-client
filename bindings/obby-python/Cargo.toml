[package]
name = "obby-python"
description = "Python bindings for obby-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# this crate only exists to be built into a wheel by maturin, so a crates.io
# release of it would be a source tree nobody can use
publish = false

[lib]
# not named for the Python module it becomes: that name is `obby_client`, which is also the crate
# this depends on, and rustdoc cannot tell the two rlibs apart. maturin renames the artifact from
# `module-name` in pyproject.toml, so Python still imports `obby_client`
name = "obby_client_py"
crate-type = ["cdylib", "rlib"]
doc = false

[dependencies]
obby-client = { workspace = true, features = ["std", "serde", "obby", "voice", "e2ee"] }
serde_json.workspace = true
# `extension-module` is deliberately absent here and supplied by maturin at build time (see
# pyproject.toml). With it set unconditionally the crate does not link libpython, which is correct
# for a wheel and makes `cargo test` fail to link
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[lints]
workspace = true
