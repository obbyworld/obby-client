[package]
name = "obby-ffi"
description = "C ABI for obby-client: the floor every other language binding is checked against"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
categories.workspace = true
keywords.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# the shipped C library speaks everything an Obby client needs; a host that wants a smaller one
# builds with --no-default-features and adds back what it uses
default = ["obby", "voice", "e2ee"]
obby = ["obby-client/obby"]
voice = ["obby-client/voice"]
e2ee = ["obby-client/e2ee"]

[dependencies]
obby-client = { workspace = true, features = ["std", "serde"] }
serde_json.workspace = true

[lints.rust]
# the one place unsafe lives. Every other crate in the workspace denies it, and this crate exists
# so that they can: the C boundary cannot be expressed without it
unsafe_code = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
missing_safety_doc = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
