language = "C"
header = """
/* The C ABI for obby-client. Generated by cbindgen: do not edit by hand.
 *
 * Thread safety: a handle is not synchronised. Never use one handle from two threads at once, not
 * even for two calls that only read. Give each thread its own handle, or take your own lock. */"""
autogen_warning = "/* Regenerate with: cbindgen --config bindings/obby-ffi/cbindgen.toml --crate obby-ffi --output bindings/obby-ffi/include/obby_ffi.h */"
include_guard = "OBBY_FFI_H"
include_version = true
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

[parse]
parse_deps = false

[export.rename]
ObbyClient = "obby_client_t"
ObbyBytes = "obby_bytes_t"

[fn]
sort_by = "None"
