[package]
name = "obby-wasm"
description = "WebAssembly bindings for obby-client, consumed by the browser and by Bun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# this crate only exists to be built into an npm package by wasm-pack, so a
# crates.io release of it would be a source tree nobody can use
publish = false

# wasm-pack ships an old wasm-opt that rejects the features rustc now emits by default, so we name
# them rather than turning the optimiser off
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obby-client = { workspace = true, features = ["std", "serde", "obby", "voice", "e2ee"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# the workspace set, with one exception this crate exists to make: JavaScript has a single number
# type, so the boundary has to turn a `u64` of milliseconds into an `f64` and back. The alternative
# is a `BigInt` in every signature that carries a millisecond, converted at every call site.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
