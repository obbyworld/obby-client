[advisories]
yanked = "deny"

[licenses]
allow = [
    # our own crates
    "GPL-3.0-or-later",
    "GPL-3.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # wasi and the wasm toolchain ship under this
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
